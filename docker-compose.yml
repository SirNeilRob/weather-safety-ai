services:
  backend:
    build: .
    ports:
      - "8000:8000"
    # SWARMS_API_KEY and the Swarm settings come from the repo's .env
    # (gitignored). Without a key the backend runs fully offline.
    env_file: .env
    environment:
      DB_PATH: /data/sharkbyte.db
    volumes:
      - sharkbyte-data:/data

volumes:
  sharkbyte-data:
